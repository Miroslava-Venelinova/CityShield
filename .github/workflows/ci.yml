name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    name: Cloudflare Worker (typecheck + vitest + dry-run deploy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json && npx tsc -p test/tsconfig.json
      - run: npm test
      # Build + bundle-size check (3 MB gzipped free-plan limit).
      - run: npx wrangler deploy --dry-run

  app:
    name: React Native app (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  deploy:
    name: Deploy Worker
    # Requires the CLOUDFLARE_API_TOKEN repo secret ("Edit Cloudflare Workers"
    # template, SPEC.md §3.5). Remote D1 + secrets must be provisioned first (§3.3).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend
          command: deploy
