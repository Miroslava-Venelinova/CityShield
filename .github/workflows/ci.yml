name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ingestion:
    name: Python ingestion (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Integration tests need a live MongoDB — unit scope only in CI.
      - run: pytest -m "not integration"

  api:
    name: ASP.NET API (dotnet test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Integration tests spin up their own PostGIS container via
      # Testcontainers, which works on GitHub-hosted runners.
      - run: dotnet test ASP/CityShieldAPI/CityShieldAPI.sln

  app:
    name: React Native app (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
