# ── CityShield self-hosted stack ──────────────────────────────────────────────
# Copy .env.example to .env, fill in the secrets, place the Firebase key at
# ./fcm.json, then:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# AI provider: AI_PROVIDER=ollama (default, fully self-hosted — the ollama
# service runs via COMPOSE_PROFILES=ollama, set in .env.example) or
# AI_PROVIDER=gemini (hosted Gemini API — set GEMINI_API_KEY and
# COMPOSE_PROFILES= empty so no Ollama container starts).
#
# First-run only:
#   docker compose -f docker-compose.prod.yml exec ollama ollama pull qwen3.5   # ollama profile only
#   docker compose -f docker-compose.prod.yml exec ingestion python -m data.postgres.seeding.seeder
#
# TLS is NOT handled here — run a reverse proxy (Caddy / nginx / Traefik) in
# front of the api service and point the mobile app at the HTTPS endpoint.
# (Proxy__Enabled makes the API trust X-Forwarded-* from that proxy.)
#
# For the managed-cloud deployment (Cloud Run + Neon + Gemini) see PLAN.md.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-CityShieldDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-CityShieldDB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Only started with COMPOSE_PROFILES=ollama (the default in .env.example);
    # not needed when AI_PROVIDER=gemini.
    profiles: ["ollama"]
    volumes:
      - ./docker-data/ollama:/root/.ollama
    # GPU access (optional, much faster parsing) — uncomment on a host with
    # the NVIDIA container toolkit installed:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: ./ASP/CityShieldAPI
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5276:5276"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-CityShieldDB};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env (32+ random characters)}
      Jwt__Issuer: CityShield
      Jwt__Audience: CityShield Users
      Jwt__ExpireMinutes: "60"
      Ingest__ApiKey: ${INGEST_API_KEY:?set INGEST_API_KEY in .env}
      Database__AutoMigrate: "true"
      # The documented setup runs a TLS-terminating reverse proxy in front of
      # the API; this makes it honor X-Forwarded-Proto / X-Forwarded-For.
      Proxy__Enabled: ${PROXY_ENABLED:-true}
    volumes:
      - ./fcm.json:/app/fcm.json:ro

  ingestion:
    build: ./backend
    restart: unless-stopped
    # No depends_on for ollama: it's profile-gated (AI_PROVIDER=gemini runs
    # without it), and the AI call path retries while the model loads anyway.
    depends_on:
      - api
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-CityShieldDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ASP_API_URL: http://api:5276/api/alerts/submit-data
      ASP_API_KEY: ${INGEST_API_KEY}
      ASP_API_VERIFY_SSL: "true"
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
