<?xml version="1.0" encoding="utf-8"?>
<!--
  CityShield stacked lockup: brand mark over the wordmark.

  The mark artwork is a copy of logo-mark.svg (translated +26 on x to centre it
  in the wider box) — edit that file first, then mirror the change here.

  The wordmark uses #2B7FD4 — the mark's hue (~210°) held at a darker value.
  Matching #4FA3F0 exactly would drop the text under a readable contrast on
  white; this keeps the pair related without making them the same colour.

  The wordmark uses a live <text> node, so it renders with whatever grotesque
  the viewer has. That is fine in-repo; convert the text to outlines before
  handing this to a store listing or a printer.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 176" width="180" height="176" fill="none">
  <g transform="translate(26 0)">
    <path d="M 64 8
             L 104 21.5
             Q 108 22.8 108 27
             L 108 60
             Q 108 88 66.4 119.4
             Q 64 121 61.6 119.4
             Q 20 88 20 60
             L 20 27
             Q 20 22.8 24 21.5
             Z"
          fill="#4FA3F0"/>

    <g fill="#FFFFFF">
      <rect x="57.5" y="58" width="13" height="36" rx="2"/>
      <circle cx="64" cy="48" r="4"/>
    </g>

    <path d="M 53.6 42 A 12 12 0 0 1 74.4 42"
          stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" fill="none"/>
    <path d="M 46.7 36 A 22 22 0 0 1 81.3 36"
          stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" fill="none" opacity="0.55"/>
  </g>

  <text x="90" y="162" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="800" letter-spacing="-0.4">
    <tspan fill="#0D2145">City</tspan><tspan fill="#2B7FD4">Shield</tspan>
  </text>
</svg>
