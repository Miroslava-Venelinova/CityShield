<?xml version="1.0" encoding="utf-8"?>
<!--
  CityShield stacked lockup: brand mark over the wordmark.

  The mark artwork is a copy of logo-mark.svg (translated +26 on x to centre it
  in the wider box) — edit that file first, then mirror the change here.

  The wordmark uses a live <text> node, so it renders with whatever grotesque
  the viewer has. That is fine in-repo; convert the text to outlines before
  handing this to a store listing or a printer.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 176" width="180" height="176" fill="none">
  <defs>
    <linearGradient id="csShieldFill" x1="50" y1="8" x2="130" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.52" stop-color="#1A56DB"/>
      <stop offset="1" stop-color="#0F2E7A"/>
    </linearGradient>
    <linearGradient id="csShieldSheen" x1="54" y1="10" x2="102" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(26 0)">
    <path id="csShieldPath"
          d="M 64 6.2
             C 65.2 6.2 66.4 6.4 67.5 6.8
             L 101.7 17.6
             C 105.5 18.8 108 22.3 108 26.3
             L 108 60
             C 108 86 92 106.4 66.6 120.9
             C 65 121.8 63 121.8 61.4 120.9
             C 36 106.4 20 86 20 60
             L 20 26.3
             C 20 22.3 22.5 18.8 26.3 17.6
             L 60.5 6.8
             C 61.6 6.4 62.8 6.2 64 6.2
             Z"
          fill="url(#csShieldFill)"/>
    <use href="#csShieldPath" fill="url(#csShieldSheen)"/>

    <g transform="translate(64 61) scale(0.93) translate(-64 -61)">
      <use href="#csShieldPath" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"
           stroke-width="1.7" stroke-linejoin="round"/>
    </g>

    <g fill="#FFFFFF">
      <rect x="38" y="71" width="8.5" height="23" rx="1.4" opacity="0.52"/>
      <rect x="80.5" y="76" width="9.5" height="18" rx="1.4" opacity="0.52"/>
      <rect x="48" y="80" width="8" height="14" rx="1.4" opacity="0.78"/>
      <rect x="72" y="66" width="7" height="28" rx="1.4" opacity="0.78"/>
      <path d="M 57.5 94 L 57.5 59.5 Q 57.5 58 59 58 L 60.5 58 L 60.5 51.5
               Q 60.5 50 62 50 L 66 50 Q 67.5 50 67.5 51.5 L 67.5 58
               L 69 58 Q 70.5 58 70.5 59.5 L 70.5 94 Z"/>
    </g>
    <g fill="#0D2145" opacity="0.28">
      <rect x="59" y="67" width="10" height="1.2" rx="0.6"/>
      <rect x="59" y="73" width="10" height="1.2" rx="0.6"/>
      <rect x="59" y="79" width="10" height="1.2" rx="0.6"/>
      <rect x="59" y="85" width="10" height="1.2" rx="0.6"/>
    </g>

    <rect x="63.2" y="43" width="1.6" height="8" rx="0.8" fill="#7DD3FC"/>
    <circle cx="64" cy="42" r="3.4" fill="#BAE6FD"/>
    <path d="M 51.95 37.13 A 13 13 0 0 1 76.05 37.13"
          stroke="#7DD3FC" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M 44.53 34.13 A 21 21 0 0 1 83.47 34.13"
          stroke="#7DD3FC" stroke-width="3.4" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <text x="90" y="162" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="800" letter-spacing="-0.4">
    <tspan fill="#0D2145">City</tspan><tspan fill="#1A56DB">Shield</tspan>
  </text>
</svg>
