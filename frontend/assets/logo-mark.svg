<?xml version="1.0" encoding="utf-8"?>
<!--
  CityShield brand mark (icon only).
  A crest shield in the brand blue ramp, holding a symmetric city skyline.
  The centre tower carries a beacon broadcasting two alert waves — the app's
  actual job: pushing region-scoped alerts to the people standing in them.

  Geometry is symmetric about x = 64 so the mark stays balanced at any size.
  Keep this file the source of truth; frontend/src/components/CityShieldLogo.tsx
  mirrors it with react-native-svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Bright blue at the top-left shoulder, deepening to navy at the tip -->
    <linearGradient id="csShieldFill" x1="24" y1="8" x2="104" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.52" stop-color="#1A56DB"/>
      <stop offset="1" stop-color="#0F2E7A"/>
    </linearGradient>
    <!-- Diagonal sheen, strongest at the top-left, gone by mid-face -->
    <linearGradient id="csShieldSheen" x1="28" y1="10" x2="76" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Shield body -->
  <path id="csShieldPath"
        d="M 64 6.2
           C 65.2 6.2 66.4 6.4 67.5 6.8
           L 101.7 17.6
           C 105.5 18.8 108 22.3 108 26.3
           L 108 60
           C 108 86 92 106.4 66.6 120.9
           C 65 121.8 63 121.8 61.4 120.9
           C 36 106.4 20 86 20 60
           L 20 26.3
           C 20 22.3 22.5 18.8 26.3 17.6
           L 60.5 6.8
           C 61.6 6.4 62.8 6.2 64 6.2
           Z"
        fill="url(#csShieldFill)"/>
  <use href="#csShieldPath" fill="url(#csShieldSheen)"/>

  <!-- Inset rim: a scaled copy of the outline, hairline white -->
  <g transform="translate(64 61) scale(0.93) translate(-64 -61)">
    <use href="#csShieldPath" fill="none" stroke="#FFFFFF" stroke-opacity="0.22"
         stroke-width="1.7" stroke-linejoin="round"/>
  </g>

  <!-- Skyline, baseline y=94. Roof heights deliberately avoid a pyramid: the
       block left of the tower dips, so the silhouette reads as a city rather
       than a signal-strength meter. Outer blocks sit back in the haze. -->
  <g fill="#FFFFFF">
    <rect x="38" y="71" width="8.5" height="23" rx="1.4" opacity="0.52"/>
    <rect x="80.5" y="76" width="9.5" height="18" rx="1.4" opacity="0.52"/>
    <rect x="48" y="80" width="8" height="14" rx="1.4" opacity="0.78"/>
    <rect x="72" y="66" width="7" height="28" rx="1.4" opacity="0.78"/>
    <!-- Centre tower with a setback — the classic skyscraper cue -->
    <path d="M 57.5 94 L 57.5 59.5 Q 57.5 58 59 58 L 60.5 58 L 60.5 51.5
             Q 60.5 50 62 50 L 66 50 Q 67.5 50 67.5 51.5 L 67.5 58
             L 69 58 Q 70.5 58 70.5 59.5 L 70.5 94 Z"/>
  </g>
  <!-- Floor bands on the tower. Horizontal, not vertical: vertical mullions
       split the mass into three bars and the whole mark reverts to reading
       as a signal meter. -->
  <g fill="#0D2145" opacity="0.28">
    <rect x="59" y="67" width="10" height="1.2" rx="0.6"/>
    <rect x="59" y="73" width="10" height="1.2" rx="0.6"/>
    <rect x="59" y="79" width="10" height="1.2" rx="0.6"/>
    <rect x="59" y="85" width="10" height="1.2" rx="0.6"/>
  </g>

  <!-- Beacon mast, lamp and the two alert waves -->
  <rect x="63.2" y="43" width="1.6" height="8" rx="0.8" fill="#7DD3FC"/>
  <circle cx="64" cy="42" r="3.4" fill="#BAE6FD"/>
  <path d="M 51.95 37.13 A 13 13 0 0 1 76.05 37.13"
        stroke="#7DD3FC" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M 44.53 34.13 A 21 21 0 0 1 83.47 34.13"
        stroke="#7DD3FC" stroke-width="3.4" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
