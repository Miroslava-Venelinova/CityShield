<?xml version="1.0" encoding="utf-8"?>
<!--
  CityShield brand mark (icon only).
  A flat light-blue shield holding a single tower that broadcasts two alert
  waves — region-scoped alerts pushed to the people standing in them.

  Minimal by construction: one fill colour, one accent (white), no gradient,
  no sheen, no inset rim, no floor bands. Everything here earns its place; if
  you are tempted to add a detail, check it still survives at 24px first.

  Geometry is symmetric about x = 64 so the mark stays balanced at any size.
  Keep this file the source of truth; frontend/src/components/CityShieldLogo.tsx
  mirrors it with react-native-svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Shield body. Straight shoulders into a single curve per side, meeting in
       a softened tip — fewer segments than the old crest, which needed four
       curves just for the corner radii. -->
  <path d="M 64 8
           L 104 21.5
           Q 108 22.8 108 27
           L 108 60
           Q 108 88 66.4 119.4
           Q 64 121 61.6 119.4
           Q 20 88 20 60
           L 20 27
           Q 20 22.8 24 21.5
           Z"
        fill="#4FA3F0"/>

  <!-- Tower and beacon lamp -->
  <g fill="#FFFFFF">
    <rect x="57.5" y="58" width="13" height="36" rx="2"/>
    <circle cx="64" cy="48" r="4"/>
  </g>

  <!-- Two alert waves. The outer one is held at 0.55 so the pair reads as one
       signal fading outward rather than as two equal rings. -->
  <path d="M 53.6 42 A 12 12 0 0 1 74.4 42"
        stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  <path d="M 46.7 36 A 22 22 0 0 1 81.3 36"
        stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" fill="none" opacity="0.55"/>
</svg>
