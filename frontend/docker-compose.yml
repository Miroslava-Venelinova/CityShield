services:

  # ── Metro Bundler ─────────────────────────────────────────────────────────────
  # Port 8081 mapped to Windows host so `adb reverse tcp:8081 tcp:8081`
  # can tunnel: emulator → Windows localhost:8081 → this container.
  metro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cityshield_metro
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - gradle_cache:/root/.gradle
    environment:
      - API_URL=${API_URL:-http://10.0.2.2:5276}
    command: sh -c "npm install --legacy-peer-deps --silent && npx react-native start --host 0.0.0.0 --reset-cache"

  # ── APK Build ─────────────────────────────────────────────────────────────────
  build:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cityshield_build
    network_mode: host
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - gradle_cache:/root/.gradle
    environment:
      - API_URL=${API_URL:-http://10.0.2.2:5276}
    command: sh -c "/app/scripts/build.sh"

  # ── ADB Installer ─────────────────────────────────────────────────────────────
  install:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cityshield_install
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    command: sh -c "/app/scripts/install.sh"

volumes:
  node_modules:
  gradle_cache:
